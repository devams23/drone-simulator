<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1b232c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>SkyDuty Remote</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #e9eef2;
        --dim: rgba(233, 238, 242, 0.55);
        --faint: rgba(233, 238, 242, 0.14);
        --accent: #7cc9c0;
        --warn: #ff8a6b;
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
      html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; touch-action: none; }
      body {
        font-family: Inter, system-ui, sans-serif; color: var(--ink);
        background:
          radial-gradient(120% 90% at 50% 0%, #4a5b6b 0%, #2b3742 45%, #1b232c 100%);
      }
      /* The radio body. */
      .tx {
        position: fixed; inset: 0; padding: max(10px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
        display: grid; grid-template-columns: 1fr minmax(170px, 0.8fr) 1fr; align-items: center; gap: 2vw;
      }
      .gimbal { position: relative; justify-self: center; width: min(40vw, 78vh); aspect-ratio: 1; touch-action: none; }
      .well {
        position: absolute; inset: 0; border-radius: 50%;
        background:
          radial-gradient(circle at 50% 50%, #151b21 0 34%, transparent 34.5%),
          repeating-conic-gradient(from 0deg, rgba(255,255,255,0.05) 0 0.5deg, transparent 0.5deg 15deg),
          radial-gradient(circle at 50% 40%, #2f3b46, #1a2129 70%);
        box-shadow: inset 0 2px 10px rgba(0,0,0,0.6), inset 0 -1px 0 rgba(255,255,255,0.06), 0 1px 0 rgba(255,255,255,0.08), 0 18px 40px rgba(0,0,0,0.35);
      }
      .well::before { /* travel square, like the gimbal gate */
        content: ''; position: absolute; inset: 15%; border-radius: 18%;
        border: 1px solid var(--faint);
      }
      .well::after { /* centre cross */
        content: ''; position: absolute; inset: 15%;
        background: linear-gradient(var(--faint), var(--faint)) center / 1px 100% no-repeat, linear-gradient(var(--faint), var(--faint)) center / 100% 1px no-repeat;
      }
      .detent { position: absolute; left: 10%; right: 10%; top: 50%; height: 0; border-top: 1px dashed rgba(124, 201, 192, 0.5); }
      .detent span { position: absolute; right: 0; top: -16px; font-size: 9px; letter-spacing: 0.18em; color: var(--accent); opacity: 0.8; }
      .stick {
        position: absolute; left: 50%; top: 50%; width: 30%; aspect-ratio: 1; margin: -15% 0 0 -15%; border-radius: 50%;
        background:
          radial-gradient(circle at 50% 50%, transparent 0 46%, rgba(0,0,0,0.25) 47% 49%, transparent 50%),
          repeating-conic-gradient(#c9d0d6 0 4deg, #8e979f 4deg 8deg),
          #b9c1c8;
        box-shadow: 0 10px 18px rgba(0,0,0,0.5), 0 2px 3px rgba(0,0,0,0.5), inset 0 2px 2px rgba(255,255,255,0.6), inset 0 -3px 6px rgba(0,0,0,0.35);
        will-change: transform;
      }
      .stick::after { content: ''; position: absolute; inset: 22%; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #f2f4f6, #9aa3ab 70%); box-shadow: inset 0 -2px 4px rgba(0,0,0,0.3); }
      .label { position: absolute; left: 0; right: 0; bottom: -2px; transform: translateY(100%); text-align: center; font-size: 10px; letter-spacing: 0.22em; color: var(--dim); padding-top: 6px; }

      /* Centre console */
      .console { display: flex; flex-direction: column; gap: 10px; align-self: stretch; justify-content: center; }
      .lcd {
        border-radius: 14px; padding: 10px 12px;
        background: linear-gradient(180deg, rgba(255,255,255,0.07), rgba(255,255,255,0.03));
        border: 1px solid rgba(255,255,255,0.09);
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
        backdrop-filter: blur(8px);
      }
      .brand { display: flex; align-items: center; justify-content: space-between; font-size: 11px; letter-spacing: 0.24em; color: var(--dim); }
      .brand b { color: var(--ink); font-weight: 500; }
      .link { white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; }
      .link i { width: 7px; height: 7px; border-radius: 50%; background: var(--warn); box-shadow: 0 0 8px var(--warn); }
      .link.on i { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
      .tele { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; margin-top: 10px; }
      .tele div { display: flex; flex-direction: column; }
      .tele label { font-size: 9px; letter-spacing: 0.2em; color: var(--dim); }
      .tele b { font-size: clamp(16px, 4.6vh, 24px); font-weight: 300; font-variant-numeric: tabular-nums; }
      .tele b small { font-size: 0.5em; color: var(--dim); margin-left: 3px; }
      .meter { height: 3px; border-radius: 2px; background: var(--faint); margin-top: 4px; overflow: hidden; }
      .meter i { display: block; height: 100%; width: 100%; background: var(--accent); transition: width 0.3s; }
      .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .btn {
        appearance: none; border: 1px solid rgba(255,255,255,0.1); color: var(--ink); font: 500 11px Inter, sans-serif; letter-spacing: 0.16em;
        padding: 0; height: clamp(34px, 11vh, 52px); border-radius: 12px;
        background: linear-gradient(180deg, rgba(255,255,255,0.10), rgba(255,255,255,0.04));
        box-shadow: 0 6px 14px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.08);
        transition: transform 0.06s, background 0.12s;
      }
      .btn small { display: block; font-size: 8px; letter-spacing: 0.18em; color: var(--dim); margin-top: 2px; }
      .btn.down { transform: translateY(1px) scale(0.98); background: rgba(124, 201, 192, 0.28); border-color: rgba(124, 201, 192, 0.6); }
      .btn.tool { background: linear-gradient(180deg, rgba(124,201,192,0.22), rgba(124,201,192,0.08)); border-color: rgba(124,201,192,0.35); }

      .cover {
        position: fixed; inset: 0; display: none; place-items: center; text-align: center; padding: 24px;
        background: radial-gradient(120% 90% at 50% 0%, #4a5b6b, #1b232c); z-index: 5;
      }
      .cover h1 { font-weight: 300; font-size: 26px; margin: 0 0 8px; letter-spacing: 0.02em; }
      .cover p { color: var(--dim); font-size: 14px; line-height: 1.5; margin: 0 auto; max-width: 300px; }
      .cover .phone { width: 46px; height: 76px; border: 2px solid var(--ink); border-radius: 9px; margin: 0 auto 20px; animation: turn 2.4s ease-in-out infinite; }
      @keyframes turn { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
      @media (orientation: portrait) { #rotate { display: grid; } }
      #start { display: grid; }
      #start.gone { display: none; }
      .go { margin-top: 22px; height: 46px; padding: 0 28px; width: auto; border-radius: 23px; font-size: 12px; background: #e9eef2; color: #1b232c; border: 0; }
    </style>
  </head>
  <body>
    <main class="tx">
      <div class="gimbal" id="left">
        <div class="well"></div>
        <div class="detent"><span>HOVER</span></div>
        <div class="stick"></div>
        <div class="label">THROTTLE · YAW</div>
      </div>

      <section class="console">
        <div class="lcd">
          <div class="brand"><b>SKYDUTY</b><span class="link" id="link"><i></i><span id="linktxt">Searching</span></span></div>
          <div class="tele">
            <div><label>ALT</label><b id="alt">0<small>m</small></b></div>
            <div><label>SPEED</label><b id="spd">0<small>km/h</small></b></div>
            <div><label>BATTERY</label><b id="bat">100<small>%</small></b><div class="meter"><i id="batbar"></i></div></div>
            <div><label>HULL</label><b id="hull">100<small>%</small></b><div class="meter"><i id="hullbar"></i></div></div>
          </div>
        </div>
        <div class="row">
          <button class="btn tool" data-hold="pri">TOOL<small>HOLD</small></button>
          <button class="btn" data-hold="sec">ALT<small>ROCKETS</small></button>
        </div>
        <div class="row">
          <button class="btn" data-hold="up">TILT ▲</button>
          <button class="btn" data-hold="down">TILT ▼</button>
        </div>
        <button class="btn" id="view">CAMERA<small id="viewtxt">COCKPIT</small></button>
      </section>

      <div class="gimbal" id="right">
        <div class="well"></div>
        <div class="stick"></div>
        <div class="label">PITCH · ROLL</div>
      </div>
    </main>

    <div class="cover" id="rotate"><div><div class="phone"></div><h1>Turn your phone</h1><p>The remote works in landscape, like a real transmitter.</p></div></div>
    <div class="cover" id="start">
      <div>
        <h1>SkyDuty Remote</h1>
        <p>Left stick: throttle up and down (it stays where you leave it), yaw left and right. Right stick: fly forward, back and sideways.</p>
        <button class="btn go" id="go">Start</button>
      </div>
    </div>
    <script type="module" src="/src/phone.ts"></script>
  </body>
</html>
